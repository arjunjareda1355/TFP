<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Folded paper page curl gradients for dark theme -->
    <linearGradient id="darkFoldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="35%" stop-color="#F97316" />
      <stop offset="70%" stop-color="#FED7AA" />
      <stop offset="95%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Inner fold shadow underneath the curled leaf -->
    <linearGradient id="darkInnerCurlShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#090807" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#121110" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft ambient drop shadow for fold -->
    <filter id="darkFoldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <g transform="translate(400, 310)">
    <!-- TFP Intertwined Monogram -->
    
    <!-- Serif T Top Bar Crisp Geometry -->
    <path d="M -215 -225 L 110 -225 L 110 -175 L 85 -175 C 80 -200 65 -205 18 -205 L 18 190 C 18 220 30 228 50 230 L 50 245 L -50 245 L -50 230 C -30 228 -18 220 -18 190 L -18 -205 C -65 -205 -80 -200 -85 -175 L -110 -175 L -110 -225 Z" fill="#F5F3EF" />

    <!-- Serif F Upper and Middle Arms -->
    <path d="M -200 -125 L -70 -125 L -18 -125 L -18 -75 L -70 -75 C -110 -75 -125 -70 -135 -40 L -155 -40 L -155 -105 L -185 -105 C -195 -105 -200 -115 -200 -125 Z" fill="#F5F3EF" />
    <path d="M -160 0 L -18 0 L -18 35 L -100 35 C -125 35 -138 42 -145 60 L -165 60 L -165 -15 L -140 -15 C -145 0 -155 0 -160 0 Z" fill="#F5F3EF" />

    <!-- Left Foot Serif of F -->
    <path d="M -195 100 L -125 100 L -125 80 C -150 80 -160 70 -165 40 L -195 40 Z" fill="#F5F3EF" />

    <!-- The 'P' Large Curving Bowl on the Right -->
    <path d="M 0 -135 C 90 -135 215 -105 215 15 C 215 110 120 145 0 145 L 0 95 C 65 95 145 75 145 15 C 145 -45 75 -85 0 -85 Z" fill="#F5F3EF" />

    <!-- The Curled Folded Page Effect on P's Loop -->
    <path d="M 35 -135 C 100 -130 180 -90 190 0 C 130 -30 70 -70 20 -115 Z" fill="url(#darkInnerCurlShadow)" opacity="0.9" />
    
    <path d="M 18 -135 C 90 -130 195 -80 215 15 C 180 50 115 5 20 -110 C 18 -125 18 -130 18 -135 Z" 
          fill="url(#darkFoldGradient)" 
          filter="url(#darkFoldShadow)" />
          
    <path d="M 215 15 C 170 30 80 -25 18 -135" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.95" />
  </g>

  <!-- Typography Lockup -->
  <!-- "T H E" -->
  <text x="400" y="585" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Newsreader', 'Georgia', serif" 
        font-size="28" 
        font-weight="500" 
        letter-spacing="0.45em" 
        fill="#F5F3EF">
    THE
  </text>

  <!-- "F O L D E D   P A G E" -->
  <text x="400" y="655" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Newsreader', 'Georgia', serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.32em" 
        fill="#F5F3EF">
    FOLDED PAGE
  </text>

  <!-- Delicate Centered Divider Rule -->
  <line x1="310" y1="695" x2="490" y2="695" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />

  <!-- "W H A T ' S   W O R T H   K N O W I N G ." -->
  <text x="400" y="738" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', sans-serif" 
        font-size="19" 
        font-weight="700" 
        letter-spacing="0.42em" 
        fill="#A8A49C">
    WHAT'S WORTH KNOWING.
  </text>
</svg>
