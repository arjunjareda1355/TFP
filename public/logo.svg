<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background paper subtle warm texture/gradient -->
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0" />
      <stop offset="100%" stop-color="#F2ECE1" />
    </linearGradient>

    <!-- Folded paper page curl gradients -->
    <linearGradient id="foldGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1918" />
      <stop offset="25%" stop-color="#3A3833" />
      <stop offset="60%" stop-color="#C2BCB0" />
      <stop offset="90%" stop-color="#EDE7DC" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Inner fold shadow underneath the curled leaf -->
    <linearGradient id="innerCurlShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#1A1918" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1A1918" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft ambient drop shadow for fold -->
    <filter id="foldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Canvas Background (Warm Cream Paper) -->
  <rect width="800" height="800" fill="url(#paperBg)" />

  <g transform="translate(400, 310)">
    <!-- TFP Intertwined Monogram -->
    
    <!-- Central T Top Bar -->
    <path d="M -210 -220 L 110 -220 C 110 -220 110 -195 95 -195 C 80 -195 72 -205 25 -205 L 25 -190 L -15 -190 L -15 -205 C -65 -205 -75 -195 -90 -195 C -105 -195 -105 -220 -105 -220 Z" fill="#121110" />
    <path d="M -210 -220 C -210 -220 -210 -190 -195 -190 C -180 -190 -170 -205 -125 -205 L 105 -205 C 60 -205 50 -190 35 -190 C 20 -190 20 -220 20 -220 L -210 -220 Z" fill="#121110" />

    <!-- Actual Serif T Top Bar Crisp Geometry -->
    <path d="M -215 -225 L 110 -225 L 110 -175 L 85 -175 C 80 -200 65 -205 18 -205 L 18 190 C 18 220 30 228 50 230 L 50 245 L -50 245 L -50 230 C -30 228 -18 220 -18 190 L -18 -205 C -65 -205 -80 -200 -85 -175 L -110 -175 L -110 -225 Z" fill="#121110" />

    <!-- Serif F Crossbars on Left -->
    <!-- F Upper Arm & Serifs -->
    <path d="M -200 -125 L -120 -125 L -18 -125 L -18 -85 L -75 -85 C -100 -85 -120 -88 -135 -110 L -200 -125 Z" fill="#121110" />
    <!-- F Main Arm -->
    <path d="M -200 -125 L -70 -125 L -18 -125 L -18 -75 L -70 -75 C -110 -75 -125 -70 -135 -40 L -155 -40 L -155 -105 L -185 -105 C -195 -105 -200 -115 -200 -125 Z" fill="#121110" />
    
    <!-- F Middle Bar -->
    <path d="M -160 0 L -18 0 L -18 35 L -100 35 C -125 35 -138 42 -145 60 L -165 60 L -165 -15 L -140 -15 C -145 0 -155 0 -160 0 Z" fill="#121110" />

    <!-- Left Foot Serif of F -->
    <path d="M -205 100 L -125 100 L -125 75 C -145 75 -155 65 -158 35 L -185 35 C -188 65 -195 75 -205 75 Z" fill="#121110" />
    <path d="M -195 100 L -125 100 L -125 80 C -150 80 -160 70 -165 40 L -195 40 Z" fill="#121110" />

    <!-- The 'P' Large Curving Bowl on the Right -->
    <path d="M 0 -135 C 90 -135 215 -105 215 15 C 215 110 120 145 0 145 L 0 95 C 65 95 145 75 145 15 C 145 -45 75 -85 0 -85 Z" fill="#121110" />

    <!-- The Iconic Curled Folded Page Effect on P's Loop -->
    <!-- Under-curl shadow -->
    <path d="M 35 -135 C 100 -130 180 -90 190 0 C 130 -30 70 -70 20 -115 Z" fill="url(#innerCurlShadow)" opacity="0.85" />
    
    <!-- Curled Over Turn-over Page with Realistic Gradient and Depth Filter -->
    <path d="M 18 -135 C 90 -130 195 -80 215 15 C 180 50 115 5 20 -110 C 18 -125 18 -130 18 -135 Z" 
          fill="url(#foldGradient)" 
          filter="url(#foldShadow)" />
          
    <!-- Subtle Fold Edge Crease Line -->
    <path d="M 215 15 C 170 30 80 -25 18 -135" stroke="#FFFFFF" stroke-width="2.5" fill="none" opacity="0.9" />
  </g>

  <!-- Typography Lockup -->
  <!-- "T H E" -->
  <text x="400" y="585" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Newsreader', 'Georgia', serif" 
        font-size="28" 
        font-weight="500" 
        letter-spacing="0.45em" 
        fill="#121110">
    THE
  </text>

  <!-- "F O L D E D   P A G E" -->
  <text x="400" y="655" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Newsreader', 'Georgia', serif" 
        font-size="52" 
        font-weight="700" 
        letter-spacing="0.32em" 
        fill="#121110">
    FOLDED PAGE
  </text>

  <!-- Delicate Centered Divider Rule -->
  <line x1="310" y1="695" x2="490" y2="695" stroke="#121110" stroke-width="1.75" stroke-linecap="round" />

  <!-- "W H A T ' S   W O R T H   K N O W I N G ." -->
  <text x="400" y="738" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', sans-serif" 
        font-size="19" 
        font-weight="700" 
        letter-spacing="0.42em" 
        fill="#121110">
    WHAT'S WORTH KNOWING.
  </text>
</svg>
